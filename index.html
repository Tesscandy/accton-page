<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accton Technology · Hsinchu. Taiwan.</title>
<meta name="description" content="Providing AI Infrastructure Technology from Design to Manufacturing">
<meta name="theme-color" content="#97c3e9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Figtree:wght@600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafd; --blue:#204fa1; --blue2:#4a6fb5; --sky:#aac8e9; --sky2:#dbe3f3;
    --yellow:#f5cf2a; --ink:#1b2440; --mute:#6b7a99;
    --disp:"Unbounded","Noto Sans TC",sans-serif;
    --cond:"Barlow Condensed","Noto Sans TC",sans-serif;
    --body:"Barlow","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--sky2) 1.2px,transparent 1.3px);background-size:18px 18px}
  a{color:inherit;text-decoration:none}
  .page{max-width:460px;margin:0 auto;padding:18px 16px 40px;position:relative}

  /* spine strip (from 背條 artwork) */
  .spine{display:flex;align-items:stretch;height:44px;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px var(--blue)}
  .spine .sq{width:48px;background:var(--blue);display:grid;place-items:center}
  .spine .wm{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px}
  .wm b{font-family:var(--body);font-weight:700;font-size:25px;letter-spacing:-.5px;color:var(--blue)}
  .wm small{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.5px;color:var(--ink)}

  /* hero (from 正面 artwork) */
  .hero{position:relative;margin-top:16px;background:var(--bg);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1.5px var(--blue);padding:26px 22px 20px}
  .hero h1{font-family:var(--disp);font-weight:900;font-size:clamp(64px,21vw,96px);line-height:.9;color:var(--blue);letter-spacing:-1px;position:relative;z-index:2}
  .hero .star{position:absolute;right:26px;top:30px;width:34px;z-index:2}
  .hero .brand{font-weight:700;font-size:clamp(26px,8vw,34px);color:var(--blue);margin-top:10px;letter-spacing:-.5px;position:relative;z-index:2}
  .hero .meta{margin-top:18px;position:relative;z-index:2}
  .hero .meta strong{display:block;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink);letter-spacing:.3px;margin-bottom:4px}
  .hero .meta span{display:block;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:1.4px;color:var(--ink);line-height:1.35}
  .planet{position:absolute;right:-24%;bottom:-16%;width:78%;z-index:1;pointer-events:none}
  .bars{position:relative;margin-top:34px;z-index:2;width:41%}
  .bars .arrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--cond);font-weight:700;font-size:14px;color:var(--ink);gap:6px}
  .bars .arrow i{flex:1;height:2px;background:var(--blue);position:relative}
  .bars .arrow i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--blue);border-right:0}
  .bars .cols{display:flex;align-items:flex-end;gap:7px;height:56px;margin-top:10px}
  .bars .cols div{flex:1;background:var(--blue);transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  .bars .cols div:last-child{background:var(--yellow)}
  .bars .lbl{display:flex;gap:7px;margin-top:6px}
  .bars .lbl span{flex:1;text-align:center;font-family:var(--cond);font-weight:600;font-size:10.5px;color:var(--ink)}
  @keyframes grow{from{transform:scaleY(0)}}

  .tagline{margin:18px 4px 0;font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.6px;color:var(--blue);line-height:1.35}

  /* featured video */
  .video{display:block;margin-top:18px;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px var(--blue)}
  .video .thumb{position:relative;aspect-ratio:16/9;background:var(--sky);overflow:hidden}
  .video .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .video .thumb.brand{background:var(--blue)}
  .video .thumb.brand::before{content:"";position:absolute;right:-12%;top:-30%;width:62%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 70% 40%,var(--sky) 0 46%,transparent 47%),radial-gradient(#ffffff55 1.6px,transparent 1.8px) 0 0/9px 9px;background-color:var(--blue2)}
  .video .thumb.brand .orb{position:absolute;left:-10%;right:-10%;top:30%;height:22%;border:2px solid #fff;border-radius:50%;transform:rotate(-8deg);z-index:1}
  .video .thumb.brand .play{left:auto;right:22px;top:auto;bottom:18px;margin:0}
  .video .thumb.brand .ttl{position:absolute;left:16px;bottom:14px;z-index:1;color:#fff;font-family:var(--disp);font-weight:900;font-size:22px;line-height:1.05;letter-spacing:-.3px}
  .video .thumb.brand .ttl small{display:block;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:2px;color:var(--sky);margin-bottom:4px}
  .video .thumb:not(.brand)::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,79,161,0) 50%,rgba(32,79,161,.55))}
  .video .play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .2s}
  .video:hover .play{transform:scale(1.08)}
  .video .tag{position:absolute;left:12px;top:12px;z-index:1;background:var(--blue);color:#fff;font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:1px;padding:6px 9px;border-radius:3px}
  .video .cap{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:700;font-size:16px;color:var(--blue)}

  /* section heading (from 背面 artwork) */
  .sec{display:flex;align-items:baseline;gap:12px;margin:30px 4px 12px}
  .sec b{font-weight:700;font-size:22px;color:var(--blue);letter-spacing:-.3px}
  .sec span{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--blue)}

  /* timeline-style link rows */
  .rows{background:#fff;border-radius:6px;box-shadow:0 0 0 1.5px var(--blue);overflow:hidden}
  .row{display:grid;grid-template-columns:44px 26px 1fr 18px;align-items:center;gap:10px;padding:15px 16px;border-top:1px solid var(--sky2);transition:background .15s}
  .row:first-child{border-top:0}
  .row:hover,.row:focus-visible{background:#eef3fb;outline:none}
  .row .yr{font-family:var(--cond);font-weight:600;font-size:18px;color:var(--blue2);letter-spacing:.5px}
  .row .ic{width:22px;height:22px;color:var(--blue)}
  .row .t{font-weight:600;font-size:17px;color:var(--ink)}
  .row .sqs{display:flex;gap:3px}
  .row .sqs i{width:9px;height:9px;background:var(--sky2)}
  .row .sqs i.on{background:var(--blue)}
  .row .sqs i.y{background:var(--yellow)}
  .row .go{color:var(--blue);transition:transform .15s}
  .row:hover .go{transform:translateX(3px)}

  /* blue feature cards (from 背面 right panel) */
  .cards{display:grid;gap:12px}
  .card{position:relative;display:flex;align-items:center;gap:14px;min-height:86px;padding:18px 18px;border-radius:6px;background:var(--blue);color:#fff;overflow:hidden;transition:transform .15s}
  .card:hover{transform:translateY(-2px)}
  .card::before{content:"";position:absolute;right:-38px;top:-48px;width:140px;height:140px;border-radius:50%;background:var(--sky);opacity:.9}
  .card::after{content:"";position:absolute;right:-110px;top:2px;width:200px;height:60px;border:2px solid #fff;border-radius:50%;transform:rotate(-14deg);border-left-color:transparent;border-bottom-color:transparent}
  .card .ic{position:relative;z-index:1;flex:0 0 42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center}
  .card .ic svg{width:22px;height:22px}
  .card .tx{position:relative;z-index:1;flex:1}
  .card .tx b{display:block;font-weight:700;font-size:18px}
  .card .tx span{display:block;font-family:var(--cond);font-weight:500;font-size:14px;letter-spacing:.6px;opacity:.85;margin-top:2px}
  .card .sqrow{position:relative;z-index:1;display:flex;gap:3px}
  .card .sqrow i{width:8px;height:8px;background:#fff}
  .card .sqrow i:last-child{background:var(--yellow)}

  /* footer w/ mini CD */
  .foot{margin-top:34px;display:flex;align-items:center;gap:16px;padding:18px;border-radius:6px;background:#fff;box-shadow:0 0 0 1.5px var(--blue)}
  .disc{flex:0 0 96px;height:96px;border-radius:50%;background:center/100% 100%;box-shadow:0 0 0 2px var(--sky),0 8px 18px -8px rgba(32,79,161,.5);animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot b{display:block;font-weight:700;font-size:16px;color:var(--blue)}
  .foot span{display:block;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:1px;color:var(--mute);margin-top:4px;line-height:1.4}
  .copy{margin-top:18px;text-align:center;font-family:var(--cond);font-weight:600;letter-spacing:2px;font-size:12px;color:var(--mute)}

  .chk{background:repeating-conic-gradient(var(--sky) 0 25%,#fff 0 50%) 0 0/34px 34px}

  .hero{padding:0;box-shadow:0 0 0 1.5px var(--sky)}
  .hero .sky{position:relative;aspect-ratio:400/264;overflow:hidden}
  .hero .sky svg,.hero .sky img{position:absolute;inset:0;width:100%;height:100%}
  .hero .sky img{object-fit:cover}
  .hist img.art{object-fit:cover}
  .hero .low{padding:14px 20px 18px;position:relative}
  .hero .name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hero .name b{font-weight:700;font-size:clamp(28px,9vw,38px);color:var(--blue);letter-spacing:-.5px;line-height:1}
  .hero .name span{font-family:var(--disp);font-weight:700;font-size:clamp(13px,4vw,17px);color:var(--blue)}
  .hero .mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
  .hero h1{color:var(--ink);font-size:clamp(54px,16.5vw,80px);margin:0}
  .hero .bars{margin:0 0 6px;width:30%;flex:0 0 30%}
  .hero .bars .arrow{display:none}
  .hero .bars .cols{height:58px;margin:0;gap:5px}
  .hero .bars .lbl{gap:5px}
  .hero .bars .lbl span{font-size:9px}
  .hero .tw{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:1.8px;color:var(--ink);margin-top:8px}
  .tagline{color:var(--ink)}
  .video{box-shadow:0 0 0 1.5px var(--sky)}
  .video .thumb.brand{background:repeating-conic-gradient(var(--sky) 0 25%,#fff 0 50%) 0 0/30px 30px}
  .video .thumb.brand::before,.video .thumb.brand .orb{display:none}
  .video .thumb.brand > svg{position:absolute;right:-22%;top:-18%;width:92%;height:136%;overflow:visible}
  .video .thumb.brand .ttl{z-index:2}
  .video .thumb.brand .ttl{color:var(--ink);background:#fff;padding:10px 12px;border-radius:4px;left:12px;bottom:12px}
  .video .thumb.brand .ttl small{color:var(--blue)}
  .video .tag{background:var(--ink)}
  .video .cap{color:var(--blue)}
  .rows{box-shadow:0 0 0 1.5px var(--sky)}
  .row .yr{color:var(--blue)}
  .row .ic{color:var(--blue)}
  .card{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px var(--sky)}
  .card::before{right:0;top:0;bottom:0;width:36%;height:auto;border-radius:0;opacity:1;
    background:repeating-conic-gradient(var(--sky) 0 25%,#fff 0 50%) 0 0/22px 22px;
    clip-path:polygon(34% 0,100% 0,100% 100%,0 100%,0 50%,34% 50%)}
  .card::after{border-color:var(--ink);border-width:1.6px;border-left-color:transparent;border-bottom-color:transparent}
  .card .ic{background:var(--sky);color:var(--ink)}
  .card .tx b{color:var(--ink)}
  .card .tx span{color:var(--mute);opacity:1}
  .foot{box-shadow:0 0 0 1.5px var(--sky)}

  /* ---------- B款 v2 ---------- */
  .logo{display:inline-block;flex:none;aspect-ratio:386/86;background:var(--lblue);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
  .sec{align-items:baseline;gap:.4em;flex-wrap:wrap}
  .sec .logo{height:23px}
  .sec span{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.3px;color:var(--lblue);line-height:1.15}
  .hero .name .logo{height:clamp(26px,8.2vw,34px)}
  .hero .name span{color:var(--lblue)}
  .hero{margin-top:0}
  .hero .top{display:flex;align-items:center;gap:12px;height:44px;padding-right:14px;background:#fff;border-bottom:1.5px solid var(--sky)}
  .hero .top .sq{flex:0 0 44px;height:44px;background:var(--sky);display:grid;place-items:center}
  .hero .top .logo{height:17px}
  .hero .top small{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.6px;color:var(--ink)}

  /* rows: no numbers + halftone / orbit graphic */
  .rows{position:relative}
  .rows .deco{position:absolute;right:0;top:0;height:100%;width:62%;pointer-events:none;z-index:0}
  .row{position:relative;z-index:1;grid-template-columns:26px 1fr 30px}
  .row:hover,.row:focus-visible{background:rgba(225,234,245,.55)}
  .row .go{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--sky);display:grid;place-items:center}
  .row .go svg{width:15px;height:15px}

  /* explore: one continuous graphic across the cards */
  .card{height:86px;min-height:0;background-color:#fff;background-repeat:no-repeat}
  .card::before,.card::after{display:none}

  /* switch selector */
  .sw{background:#fff;border-radius:6px;box-shadow:0 0 0 1.5px var(--sky);overflow:hidden}
  .seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:12px;padding:4px;border-radius:30px;background:var(--sky2)}
  .seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:30px;background:var(--blue);
    transform:translateX(calc(100% * var(--i)));transition:transform .35s cubic-bezier(.3,.8,.2,1),background .2s}
  .seg.last .knob{background:var(--yellow)}
  .seg button{position:relative;z-index:1;border:0;background:none;padding:9px 0;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.4px;color:var(--blue);cursor:pointer;transition:color .2s}
  .seg button[aria-selected="true"]{color:#fff}
  .seg.last button[aria-selected="true"]{color:var(--ink)}
  .pc{display:block;padding:6px 18px 18px}
  .pc .gp{grid-column:1/-1;margin-top:12px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
  .pc .nm{font-family:var(--disp);font-weight:700;font-size:clamp(19px,5.6vw,23px);line-height:1.2;color:var(--ink);letter-spacing:-.3px;margin-top:4px}
  .pc ul{grid-column:1/-1;list-style:none;margin-top:10px;padding-left:12px;border-left:4px solid var(--blue)}
  .pc li{font-weight:500;font-size:15px;line-height:1.5;color:var(--ink)}
  .pc li{font-weight:600}
  .pc .sp{font-family:var(--disp);font-weight:900;font-size:clamp(40px,12vw,54px);line-height:1;color:var(--ink);letter-spacing:-1px}
  .pc .md{margin-top:8px;font-weight:700;font-size:18px;color:var(--blue)}
  .pc .ds{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.6px;color:var(--mute);margin-top:2px}
  .pc .gr{display:flex;align-items:flex-end;gap:5px;height:70px}
  .pc .gr i{width:11px;background:var(--sky2);transition:height .45s cubic-bezier(.3,.8,.2,1),background .25s}
  .pc .gr i.on{background:var(--blue)}
  .pc .gr i.cur{background:var(--yellow)}
  .pgo{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--sky2);font-weight:700;font-size:15px;color:var(--blue)}
  .pgo small{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:1px;color:var(--mute)}
  .pgo:hover{background:#eef3fb}

  .svc{margin-top:12px;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:6px;background:var(--blue);color:#fff;position:relative;overflow:hidden}
  .svc::after{content:"";position:absolute;right:-40px;top:-30px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(#ffffff66 1.5px,transparent 1.7px) 0 0/9px 9px;-webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
  .svc .ic{flex:0 0 42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center}
  .svc .ic svg{width:22px;height:22px}
  .svc .tx{flex:1;position:relative;z-index:1}
  .svc b{display:block;font-weight:700;font-size:18px}
  .svc span{display:block;font-family:var(--cond);font-weight:500;font-size:14px;letter-spacing:.6px;opacity:.85;margin-top:2px}
  .svc > svg{position:relative;z-index:1}

  .tvs{margin-top:14px}
  .tvl{margin:0 4px 8px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:1.8px;color:var(--blue)}
  .tvr{display:grid;gap:12px}
  .tvs.multi .tvr{grid-auto-flow:column;grid-auto-columns:86%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
  .tvs.multi .tvr::-webkit-scrollbar{display:none}
  .tv{display:block;overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 0 0 1.5px var(--sky);scroll-snap-align:start}
  .tv .tx{display:block;padding:12px 14px 14px}
  .tv .ds{display:block;margin-top:5px;font-size:14px;line-height:1.45;color:#4a556e}
  .tv .th{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:var(--sky2)}
  .tv .th img{width:100%;height:100%;object-fit:cover;display:block}
  .tv .th i{position:absolute;right:12px;bottom:12px;width:44px;height:44px;box-shadow:0 6px 16px rgba(0,0,0,.25);border-radius:50%;background:var(--yellow);display:grid;place-items:center}
  .tv small{display:block;font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:1.6px;color:var(--blue)}
  .tv b{display:block;font-weight:700;font-size:16px;line-height:1.3;color:var(--ink)}

  .foot{flex-wrap:wrap}

  /* services overview (from accton.com/all-in-one-services) */
  .svx{border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px var(--sky)}
  .svx .top{position:relative;padding:20px 18px 18px;overflow:hidden}
  .svx .top::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;background:repeating-conic-gradient(var(--sky) 0 25%,#fff 0 50%) right top/19px 19px;
    -webkit-mask:linear-gradient(90deg,transparent,rgba(0,0,0,.25) 45%,#000);mask:linear-gradient(90deg,transparent,rgba(0,0,0,.25) 45%,#000)}
  .svx .top p{background:linear-gradient(90deg,#fff 70%,rgba(255,255,255,.75));border-radius:4px}
  .svx h3{position:relative;z-index:1;font-family:var(--disp);font-weight:900;font-size:clamp(22px,6.6vw,27px);line-height:1.12;color:var(--ink);letter-spacing:-.5px}
  .svx h3 em{font-style:normal;color:var(--blue)}
  .svx .top p{position:relative;z-index:1;margin-top:10px;font-size:15px;line-height:1.5;color:#4a556e}
  .svx .st{display:grid;grid-template-columns:repeat(3,1fr);background:var(--blue);color:#fff}
  .svx .st div{padding:14px 8px;text-align:center;border-left:1px solid rgba(255,255,255,.2)}
  .svx .st div:first-child{border-left:0}
  .svx .st b{display:block;font-family:var(--disp);font-weight:900;font-size:clamp(15px,4.6vw,19px);letter-spacing:-.3px}
  .svx .st span{display:block;margin-top:4px;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.8px;line-height:1.2;opacity:.85}
  .svx .pl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 14px}
  .svx .pl div{padding:12px;border-radius:6px;background:var(--sky2)}
  .svx .pl em{display:inline-block;font-style:normal;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.3px;padding:5px 8px;border-radius:3px;background:var(--yellow);color:var(--ink)}
  .svx .pl b{display:block;margin-top:8px;font-weight:700;font-size:14px;line-height:1.2;color:var(--ink)}
  .svx .pl p{margin-top:4px;font-size:13px;line-height:1.4;color:#4a556e}
  .svx h4{padding:4px 18px 0;font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.3;color:var(--lblue);letter-spacing:-.2px}
  .svx ol{list-style:none;counter-reset:ph;margin:10px 18px 0;padding-left:40px;position:relative}
  .svx ol li::after{content:"";position:absolute;left:-26.75px;top:14px;bottom:-14px;width:1.5px;background:rgba(42,85,165,.28);z-index:0}
  .svx ol li:last-child::after{display:none}
  .svx ol li{position:relative;padding-bottom:16px;counter-increment:ph}
  .svx ol li::before{content:"0" counter(ph);position:absolute;left:-40px;top:0;width:28px;height:28px;border-radius:50%;z-index:1;box-sizing:border-box;border:3px solid #fff;background:#fff;color:var(--blue);box-shadow:0 0 0 1.5px rgba(42,85,165,.45);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:12.5px}
  .svx ol li:first-child::before{background:var(--blue);color:#fff;box-shadow:0 0 0 1.5px var(--blue),0 3px 8px rgba(42,85,165,.28)}
  .svx ol li:last-child::before{background:#e8eef6;color:var(--blue2);box-shadow:0 0 0 1.5px #d3ddeb,0 2px 6px rgba(36,43,57,.08)}
  .svx ol b{display:block;font-weight:700;font-size:15px;color:var(--ink);padding-top:4px}
  .svx ol p{font-size:13.5px;line-height:1.4;color:#4a556e;margin-top:2px}
  .svx .cl{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 18px}
  .svx .cl span{padding:6px 10px;border-radius:30px;box-shadow:0 0 0 1.5px var(--sky);font-family:var(--cond);font-weight:600;font-size:13.5px;letter-spacing:.3px;color:var(--blue)}

        return `
      <h2 class="sec" data-sec="history"><span ${K('ui.brand')}>${esc(U.brand||'')}</span><span ${K('history.title')}>${esc(H.title||'')}</span></h2>
      <section data-sec="history" class="hist${histOpen||!fold?' open':''}" aria-label="Accton history">
        <ol>${it.map((x,k)=>{ const last=k===n-1, on=last?6:Math.max(1,Math.round(1+4*k/Math.max(1,n-2)));
          return `<li class="${k>=pv?'more':k===pv-1&&fold?'cut':''}">
            <div class="hd"><span class="y" ${K(`history.items.${k}.year`)}>${esc(x.year)}</span><span class="q" aria-hidden="true">${Array.from({length:6},(_,j)=>`<i class="${last?'ye':j<on?'on':''}"></i>`).join('')}</span></div>
            <div class="bx${x.img||HIST_ART[x.art]?'':' noart'}">${x.img?`<img class="art" src="${esc(x.img)}" alt="">`:histArt(x.art)}${x.title?`<b ${K(`history.items.${k}.title`)}>${esc(x.title)}</b>`:''}</div>${x.text?`<p ${K(`history.items.${k}.text`)}>${esc(x.text)}</p>`:''}</li>`; }).join('')}</ol>
        ${fold?`<button class="tg" type="button" aria-expanded="${histOpen}"><span>${esc(histOpen?U.showLess:U.fullHistory)}</span>${ARROW}</button>`:''}
        ${H.footer?`<p class="ft" ${K('history.footer')}>${esc(H.footer)}</p>`:''}
      </section>`; })()}

      ${(()=>{ const S=C.services||{}; if(S.show===false) return '';
        const hl=String(S.headline||'').split(/(?<=[.。])\s*/).filter(Boolean);
        const cl=Array.isArray(S.clients)?S.clients:String(S.clients||'').split(',').map(x=>x.trim()).filter(Boolean);
        return `
      <h2 class="sec" data-sec="services"><span ${K('ui.brand')}>${esc(U.brand||'')}</span><span ${K('services.title')}>${esc(S.title||'')}</span></h2>
      <section data-sec="services" class="svx" aria-label="Accton services">
        <div class="top"><h3 ${K('services.headline')}>${hl.map((w,k)=>k===hl.length-1?`<em>${esc(w)}</em>`:esc(w)).join('<br>')}</h3>${S.intro?`<p ${K('services.intro')}>${esc(S.intro)}</p>`:''}</div>
        ${S.stats?.length?`<div class="st">${S.stats.map((x,j)=>`<div><b ${K(`services.stats.${j}.num`)}>${esc(x.num)}</b><span ${K(`services.stats.${j}.label`)}>${esc(x.label)}</span></div>`).join('')}</div>`:''}
        ${S.pillars?.length?`<div class="pl">${S.pillars.map((x,j)=>`<div><em ${K(`services.pillars.${j}.tag`)}>${esc(x.tag)}</em><b ${K(`services.pillars.${j}.name`)}>${esc(x.name)}</b>${x.desc?`<p ${K(`services.pillars.${j}.desc`)}>${esc(x.desc)}</p>`:''}</div>`).join('')}</div>`:''}
        ${S.phases?.length?`${S.phasesTitle?`<h4 ${K('services.phasesTitle')}>${esc(S.phasesTitle)}</h4>`:''}<ol>${S.phases.map((x,j)=>`<li><b ${K(`services.phases.${j}.title`)}>${esc(x.title)}</b>${x.desc?`<p ${K(`services.phases.${j}.desc`)}>${esc(x.desc)}</p>`:''}</li>`).join('')}</ol>`:''}
        ${cl.length?`${S.clientsTitle?`<h4 ${K('services.clientsTitle')}>${esc(S.clientsTitle)}</h4>`:''}<div class="cl">${cl.map(x=>`<span ${K('services.clients')}>${esc(x)}</span>`).join('')}</div>`:''}
        ${S.url?`<a class="pgo" href="${esc(S.url)}" target="_blank" rel="noopener"><span ${K('services.cta')}>${esc(S.cta||'Learn more')}</span>${ARROW}</a>`:''}
      </section>`; })()}

      ${(()=>{ const P=C.products||{}, it=P.items||[]; if(P.show===false||!it.length) return '';
        const i=swI==null||swI>=it.length?it.length-1:swI, cur=it[i];
        return `
      <h2 class="sec" data-sec="products"><span ${K('ui.brand')}>${esc(U.brand||'')}</span><span ${K('products.title')}>${esc(P.title||'')}</span></h2>
      <div class="sw" data-sec="products">
        <div class="seg${i===it.length-1?' last':''}" role="tablist" style="--n:${it.length};--i:${i}"><span class="knob"></span>
          ${it.map((x,k)=>`<button role="tab" aria-selected="${k===i}" data-sp="${k}">${esc(x.speed)}</button>`).join('')}</div>
        <a class="pc" href="${esc(cur.url)}" target="_blank" rel="noopener">
          ${pcInner(it,i)}
        </a>
        <a class="pgo" href="${esc(cur.url)}" target="_blank" rel="noopener"><span><span ${K('ui.viewProduct')}>${esc(U.viewProduct||'View product')}</span> <small ${K('products.note')}>· ${esc(P.note||'')}</small></span>${ARROW}</a>
      </div>`; })()}

      ${(()=>{ const T=C.techVideo||{};
        const it=(T.items||(T.url?[{title:T.title,url:T.url,cover:T.cover}]:[])).filter(x=>x&&x.url);
        if(T.show===false||!it.length) return '';
        return `
      <section class="tvs${it.length>1?' multi':''}" data-sec="techVideo">
        ${T.label?`<div class="tvl" ${K('techVideo.label')}>${esc(T.label)}</div>`:''}
        <div class="tvr">${it.map((x,j)=>`
          <a class="tv" href="${esc(x.url)}" target="_blank" rel="noopener">
            <span class="th">${x.cover?`<img src="${esc(x.cover)}" alt="" loading="lazy">`:''}<i><svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="${INK}"/></svg></i></span>
            <span class="tx"><b ${K(`techVideo.items.${j}.title`)}>${esc(x.title)}</b>${x.desc?`<span class="ds" ${K(`techVideo.items.${j}.desc`)}>${esc(x.desc)}</span>`:''}</span>
          </a>`).join('')}</div>
      </section>`; })()}

      ${C.links?.length?`
      <h2 class="sec" data-sec="links"><span ${K('ui.brand')}>${esc(U.brand||'')}</span><span ${K('linksTitle')}>${esc(C.linksTitle||'')}</span></h2>
      <nav class="rows" data-sec="links">${rowsDeco(C.links.length)}
        ${C.links.map((l,i)=>`
          <a class="row" href="${esc(l.url)}" target="_blank" rel="noopener">
            <span class="ic">${icon(l.icon)}</span>
            <span class="t" ${K(`links.${i}.title`)}>${esc(l.title)}</span>
            <span class="go">${ARROW}</span>
          </a>`).join('')}
      </nav>`:''}

      ${C.features?.length?`
      <h2 class="sec" data-sec="features"><span ${K('ui.brand')}>${esc(U.brand||'')}</span><span ${K('featuresTitle')}>${esc(C.featuresTitle||'')}</span></h2>
      <div class="cards" data-sec="features">
        ${C.features.map((f,i)=>`
          <a class="card" href="${esc(f.url)}" target="_blank" rel="noopener" style="background-position:right 0 top ${-i*(CARD_H+CARD_GAP)}px">
            <span class="ic">${icon(f.icon)}</span>
            <span class="tx"><b ${K(`features.${i}.title`)}>${esc(f.title)}</b>${f.desc?`<span ${K(`features.${i}.desc`)}>${esc(f.desc)}</span>`:''}</span>
          </a>`).join('')}
      </div>`:''}

      <div class="foot" data-sec="contact">
        <div class="disc" style="background-image:url(${esc(C.contact?.disc||CD_IMG)})" role="img" aria-label="Accton Technology mini CD"></div>
        <div><b ${K('ui.footerTitle')}>${esc(U.footerTitle||'')}</b><span ${K('ui.footerSub')}>${String(U.footerSub||'').split(' / ').map(esc).join('<br>')}</span>
          ${C.contact?.url?`<a class="cta" href="${esc(C.contact.url)}" target="_blank" rel="noopener"><span ${K('contact.title')}>${esc(C.contact.title||'Contact Us')}</span>${ARROW}</a>`:''}</div>
      </div>
      <p class="copy" data-sec="ui" ${K('ui.copyright')}>${esc(U.copyright||'')}</p>`;
    const cd=cardsDeco(C.features?.length||0), bg=`url("data:image/svg+xml,${encodeURIComponent(cd)}")`;
    app.querySelectorAll('.card').forEach(c=>{ c.style.backgroundImage=bg; c.style.backgroundSize=`${DECO_W}px auto`; });
  }
  app.addEventListener('click',e=>{
    const lb=e.target.closest('.lang button'); if(lb && lb.dataset.lang!==lang) return setLang(lb.dataset.lang);
    const b=e.target.closest('.seg button'); if(b) setSpeed(+b.dataset.sp);
    const t=e.target.closest('.hist .tg'); if(t){ histOpen=!histOpen; const h=t.closest('.hist');
      h.classList.toggle('open',histOpen); t.setAttribute('aria-expanded',histOpen); t.querySelector('span').textContent=histOpen?C.ui.showLess:C.ui.fullHistory;
      if(!histOpen && !PREVIEW) h.scrollIntoView({block:'start',behavior:'smooth'}); }
  });
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  render();
  if(PREVIEW) parent.postMessage({type:'accton-ready', en:EN, zh:ZH_RAW},'*');
  else if(window.CONTENT_API) loadApi(window.CONTENT_API);
  else { // admin.html 試用模式：同一台電腦按「發布」的內容存在這個瀏覽器
    try{ const l=JSON.parse(localStorage.getItem('accton-content')||'null'); if(l&&l.en) useData(l.en, l.zh); }catch(e){} }
})();
</script>
</body>
</html>
